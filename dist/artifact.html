<title>浦东铁流</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: the 3D view is the page; UI is a tactical overlay pinned to the corners (ally/enemy tally top, status bottom-left,
   ammunition bottom-centre, map bottom-right). One deliberate dark look: gun-metal plates, bone text, signal amber. */
:root {
  color-scheme: dark;
  --bg: #0b0d0c; --plate: rgba(13, 17, 15, .72); --plate-solid: #111613; --line: rgba(226, 222, 204, .2); --line-strong: rgba(226, 222, 204, .42);
  --bone: #e9e5d6; --dim: rgba(233, 229, 214, .62); --faint: rgba(233, 229, 214, .3);
  --amber: #f2b33d; --amber-hot: #ffd27a; --ally: #5fd693; --enemy: #f0523c; --warn: #ff7a3c; --steel: #8fa39a;
  --f-display: 'Saira Condensed', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --f-body: 'Saira Condensed', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
  --f-mono: 'Share Tech Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --shadow: 0 0 2px rgba(0, 0, 0, .9), 0 1px 6px rgba(0, 0, 0, .6);
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--bone); overflow: hidden; font-family: var(--f-body); font-size: 15px; -webkit-text-size-adjust: 100%; }
#app { position: fixed; inset: 0; overflow: hidden; background: var(--bg); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app *, #app *::before, #app *::after { box-sizing: border-box; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
#ui { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---- boot ---- */
#boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); z-index: 60; transition: opacity .6s ease; padding-left: var(--gl); padding-right: var(--gr); }
#boot.done { opacity: 0; pointer-events: none; }
.boot-mark { font-family: var(--f-display); font-weight: 800; font-size: clamp(44px, 10vw, 104px); letter-spacing: .12em; margin-right: -.12em; line-height: 1; }
.boot-sub { font-family: var(--f-mono); font-size: 12px; letter-spacing: .2em; color: var(--steel); text-align: center; }
.boot-bar { width: min(320px, 70vw); height: 2px; background: var(--line); } .boot-bar i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .25s ease; }

/* =============================================================== HUD */
#hud { position: absolute; inset: 0; opacity: 0; transition: opacity .4s; text-shadow: var(--shadow); }
#hud.on { opacity: 1; }
.plate { background: var(--plate); border: 1px solid var(--line); backdrop-filter: blur(3px); }

/* tally bar */
#tally { position: absolute; top: calc(10px + var(--sat)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; }
.t-side { display: flex; gap: 3px; } .t-side.ally { flex-direction: row-reverse; }
.t-pip { width: 15px; height: 20px; clip-path: polygon(0 0, 100% 0, 100% 68%, 50% 100%, 0 68%); background: var(--ally); opacity: .95; }
.t-side.enemy .t-pip { background: var(--enemy); } .t-pip.dead { background: rgba(120, 120, 112, .35); }
.t-mid { display: flex; align-items: baseline; gap: 8px; padding: 2px 12px 3px; }
.t-score { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1; } .t-score.a { color: var(--ally); } .t-score.e { color: var(--enemy); }
#clock { font-family: var(--f-mono); font-size: 15px; color: var(--bone); min-width: 46px; text-align: center; }
#cap { position: absolute; top: calc(48px + var(--sat)); left: 50%; transform: translateX(-50%); width: min(300px, 56vw); text-align: center; opacity: 0; transition: opacity .3s; }
#cap.on { opacity: 1; }
#cap .lbl { font-size: 13px; letter-spacing: .12em; color: var(--dim); display: block; margin-bottom: 3px; }
#cap .bar { height: 6px; background: rgba(0, 0, 0, .55); border: 1px solid var(--line); } #cap .bar i { display: block; height: 100%; width: 0; background: var(--ally); }
#cap.enemy .bar i { background: var(--enemy); } #cap.enemy .lbl { color: var(--enemy); }

/* reticle + gun marker */
#reticle { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#reticle i { position: absolute; background: var(--bone); box-shadow: 0 0 2px #000; opacity: .85; }
#reticle i:nth-child(1) { left: -22px; top: -.5px; width: 14px; height: 1px; } #reticle i:nth-child(2) { left: 8px; top: -.5px; width: 14px; height: 1px; }
#reticle i:nth-child(3) { left: -.5px; top: 8px; width: 1px; height: 14px; } #reticle i:nth-child(4) { left: -1px; top: -1px; width: 2px; height: 2px; }
#range { position: absolute; left: 50%; top: 50%; transform: translate(30px, 12px); font-family: var(--f-mono); font-size: 13px; color: var(--dim); white-space: nowrap; }
#gunmark { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
#gunmark .ring { position: absolute; left: 50%; top: 50%; border: 1.5px solid var(--bone); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 3px rgba(0, 0, 0, .8), inset 0 0 3px rgba(0, 0, 0, .6); opacity: .9; }
#gunmark .dot { position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; border-radius: 50%; background: var(--bone); box-shadow: 0 0 3px #000; }
#gunmark.yes .ring, #gunmark.yes .dot { border-color: var(--ally); } #gunmark.yes .dot { background: var(--ally); }
#gunmark.maybe .ring { border-color: var(--amber); } #gunmark.maybe .dot { background: var(--amber); }
#gunmark.no .ring { border-color: var(--enemy); } #gunmark.no .dot { background: var(--enemy); }
#gunmark svg { position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; transform: rotate(-90deg); overflow: visible; }
#gunmark circle { fill: none; stroke: var(--amber); stroke-width: 2.5; stroke-linecap: butt; }
#gunmark .info { position: absolute; left: 34px; top: -9px; font-family: var(--f-mono); font-size: 12px; white-space: nowrap; color: var(--bone); }
#hitmsg { position: absolute; left: 50%; top: 61%; transform: translateX(-50%); text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .08em; white-space: nowrap; opacity: 0; }
#hitmsg.show { animation: pop 1.9s ease-out forwards; }
#hitmsg small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 14px; letter-spacing: .04em; color: var(--dim); }
#hitmsg.good { color: var(--amber-hot); } #hitmsg.bad { color: var(--steel); } #hitmsg.kill { color: var(--enemy); }
@keyframes pop { 0% { opacity: 0; transform: translateX(-50%) scale(1.25); } 8% { opacity: 1; transform: translateX(-50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
#banner { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); font-family: var(--f-display); font-weight: 800; font-size: clamp(22px, 4.2vw, 40px); letter-spacing: .14em; white-space: nowrap; opacity: 0; transition: opacity .35s; text-align: center; }
#banner.on { opacity: 1; } #banner small { display: block; font-weight: 500; font-size: .42em; letter-spacing: .1em; color: var(--dim); margin-top: 4px; }
#dmgdir { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#dmgdir i { position: absolute; left: -45px; top: -170px; width: 90px; height: 26px; transform-origin: 45px 170px; background: radial-gradient(ellipse at 50% 100%, rgba(240, 82, 60, .95), rgba(240, 82, 60, 0) 70%); opacity: 0; transition: opacity .9s; }
#dmgdir i.on { opacity: 1; transition: none; }

/* scope */
#scope { position: absolute; inset: 0; opacity: 0; transition: opacity .15s; pointer-events: none; background: radial-gradient(circle at 50% 50%, transparent 0, transparent min(46vh, 46vw), rgba(0, 0, 0, .93) calc(min(46vh, 46vw) + 60px)); }
#scope.on { opacity: 1; }
#scope::before, #scope::after { content: ''; position: absolute; background: rgba(233, 229, 214, .5); }
#scope::before { left: 50%; top: calc(50% + 46px); width: 1px; height: 22vh; } #scope::after { top: 50%; left: calc(50% + 46px); width: 16vh; height: 1px; box-shadow: calc(-16vh - 92px) 0 0 rgba(233, 229, 214, .5); }
#zoomlbl { position: absolute; left: 50%; top: calc(50% + min(34vh, 34vw)); transform: translateX(-50%); font-family: var(--f-mono); font-size: 14px; color: var(--amber); }

/* markers over tanks */
.mk { position: absolute; left: 0; top: 0; transform: translate(-999px, -999px); will-change: transform; text-align: center; white-space: nowrap; font-size: 13px; line-height: 1.15; }
.mk b { display: block; font-weight: 600; letter-spacing: .03em; } .mk span { font-family: var(--f-mono); font-size: 11px; color: var(--dim); }
.mk::after { content: ''; display: block; margin: 2px auto 0; width: 0; height: 0; border: 6px solid transparent; border-top-color: var(--ally); border-bottom: 0; }
.mk.ally b { color: var(--ally); } .mk.enemy b { color: var(--enemy); } .mk.enemy::after { border-top-color: var(--enemy); }
.mk.inner { margin-left: -60px; width: 120px; }

/* status (bottom-left) */
#status { position: absolute; left: var(--gl); bottom: calc(14px + var(--sab)); width: 212px; padding: 8px 10px 9px; }
#status h4 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .06em; display: flex; justify-content: space-between; align-items: baseline; }
#status h4 span { font-family: var(--f-mono); font-size: 12px; color: var(--dim); font-weight: 400; }
#xray { display: block; width: 190px; height: 150px; }
#crew { display: flex; gap: 4px; margin-top: 4px; }
#crew i { flex: 1; font-style: normal; font-size: 12px; text-align: center; padding: 2px 0; border: 1px solid var(--line); color: var(--dim); }
#crew i.dead { color: var(--enemy); border-color: var(--enemy); text-decoration: line-through; background: rgba(240, 82, 60, .14); } #crew i.hurt { color: var(--amber); border-color: var(--amber); }
#tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; min-height: 0; }
#tags i { font-style: normal; font-size: 13px; font-weight: 600; padding: 1px 7px; background: var(--enemy); color: #160503; text-shadow: none; }
#tags i.warn { background: var(--amber); } #tags i.info { background: var(--steel); }
#repair { position: absolute; left: 50%; bottom: calc(132px + var(--sab)); transform: translateX(-50%); width: 240px; text-align: center; opacity: 0; transition: opacity .2s; }
#repair.on { opacity: 1; } #repair .bar { height: 5px; background: rgba(0, 0, 0, .55); border: 1px solid var(--line); margin-top: 4px; } #repair .bar i { display: block; height: 100%; background: var(--amber); width: 0; }
#hint { position: absolute; left: 50%; bottom: calc(104px + var(--sab)); transform: translateX(-50%); font-size: 14px; color: var(--amber-hot); white-space: nowrap; opacity: 0; transition: opacity .25s; }
#hint.on { opacity: 1; } kbd { font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line-strong); padding: 0 5px; border-radius: 2px; background: rgba(0, 0, 0, .45); color: var(--bone); }

/* ammunition (bottom-centre) */
#ammo { position: absolute; left: 50%; bottom: calc(14px + var(--sab)); transform: translateX(-50%); display: flex; align-items: flex-end; gap: 6px; }
.shell { width: 104px; padding: 5px 8px 6px; border: 1px solid var(--line); background: var(--plate); position: relative; pointer-events: auto; text-align: left; display: block; }
.shell .k { position: absolute; right: 6px; top: 4px; font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.shell .ty { font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .05em; line-height: 1.1; display: block; }
.shell .nm { font-size: 12px; color: var(--dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shell .ct { font-family: var(--f-mono); font-size: 15px; display: block; margin-top: 1px; }
.shell.sel { border-color: var(--amber); background: rgba(52, 38, 10, .78); } .shell.sel .ty { color: var(--amber-hot); } .shell.empty { opacity: .4; }
#drive { width: 88px; padding: 5px 8px 6px; text-align: right; }
#speed { font-family: var(--f-mono); font-size: 26px; line-height: 1; display: block; } #drive small { font-size: 12px; color: var(--dim); }
#reloadtxt { font-family: var(--f-mono); font-size: 13px; color: var(--amber); display: block; margin-top: 2px; } #reloadtxt.ready { color: var(--ally); }

/* minimap */
#mapbox { position: absolute; right: var(--gr); bottom: calc(14px + var(--sab)); padding: 4px; line-height: 0; }
#minimap { width: 200px; height: 200px; display: block; }

/* feed + hit camera */
#feed { position: absolute; right: var(--gr); top: calc(10px + var(--sat)); display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 14px; }
#feed div { padding: 1px 8px; background: rgba(8, 10, 9, .55); border-right: 2px solid var(--line-strong); animation: feedin .25s ease-out; white-space: nowrap; }
#feed .a { color: var(--ally); } #feed .e { color: var(--enemy); } #feed em { font-style: normal; color: var(--dim); font-size: 12px; margin-left: 5px; }
@keyframes feedin { from { opacity: 0; transform: translateX(14px); } }
#hitcam { position: absolute; left: var(--gl); top: calc(10px + var(--sat)); width: 250px; padding: 7px 9px 8px; opacity: 0; transition: opacity .3s; }
#hitcam.on { opacity: 1; }
#hitcam h4 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .05em; display: flex; justify-content: space-between; gap: 8px; }
#hitcam h4 span { color: var(--amber-hot); } #hitcam h4 span.bad { color: var(--steel); } #hitcam h4 span.kill { color: var(--enemy); }
#hitcam canvas { display: block; width: 230px; height: 170px; margin: 3px 0; }
#hitcam ul { list-style: none; margin: 0; padding: 0; font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
#hitcam li.d { color: var(--enemy); } #hitcam li.h { color: var(--amber); } #hitcam p { margin: 0; font-family: var(--f-mono); font-size: 12px; color: var(--dim); }

/* death / spectate */
#dead { position: absolute; left: 50%; top: 16%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity .5s; }
#dead.on { opacity: 1; } #dead b { display: block; font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 5vw, 44px); letter-spacing: .12em; color: var(--enemy); } #dead span { font-size: 15px; color: var(--dim); }

/* =============================================================== touch */
#touch { position: absolute; inset: 0; display: none; }
.touch #touch { display: block; }
#stick { position: absolute; left: calc(var(--gl) + 14px); bottom: calc(34px + var(--sab)); width: 128px; height: 128px; border-radius: 50%; border: 1px solid var(--line-strong); background: rgba(10, 12, 11, .35); pointer-events: auto; touch-action: none; }
#stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: rgba(233, 229, 214, .28); border: 1px solid var(--line-strong); }
.tbtn { position: absolute; width: 62px; height: 62px; border-radius: 50%; border: 1px solid var(--line-strong); background: rgba(10, 12, 11, .45); pointer-events: auto; touch-action: none; font-size: 14px; font-weight: 600; color: var(--bone); display: grid; place-items: center; }
#tb-fire { right: calc(var(--gr) + 18px); bottom: calc(40px + var(--sab)); width: 84px; height: 84px; border-color: var(--amber); color: var(--amber-hot); font-size: 17px; }
#tb-zoom { right: calc(var(--gr) + 112px); bottom: calc(30px + var(--sab)); } #tb-shell { right: calc(var(--gr) + 104px); bottom: calc(102px + var(--sab)); }
#tb-fix { right: calc(var(--gr) + 28px); bottom: calc(136px + var(--sab)); } #tb-pause { right: var(--gr); top: calc(54px + var(--sat)); width: 44px; height: 44px; font-size: 13px; }
.touch #status { bottom: auto; top: calc(64px + var(--sat)); transform: scale(.78); transform-origin: left top; }
.touch #mapbox { bottom: auto; top: calc(104px + var(--sat)); transform: scale(.62); transform-origin: right top; }
.touch #ammo { transform: translateX(-50%) scale(.82); transform-origin: 50% 100%; } .touch #drive { display: none; }
.touch #hitcam { transform: scale(.8); transform-origin: left top; top: calc(250px + var(--sat)); } .touch #feed { top: calc(10px + var(--sat)); right: calc(var(--gr) + 52px); font-size: 12px; }

/* =============================================================== menus */
.screen { position: absolute; inset: 0; display: none; pointer-events: auto; padding: calc(18px + var(--sat)) var(--gr) calc(18px + var(--sab)) var(--gl); }
.screen.on { display: flex; }
#garage { flex-direction: row; justify-content: space-between; gap: 18px; background: linear-gradient(90deg, rgba(7, 9, 8, .86) 0, rgba(7, 9, 8, .45) 24%, rgba(7, 9, 8, 0) 42%, rgba(7, 9, 8, 0) 60%, rgba(7, 9, 8, .5) 78%, rgba(7, 9, 8, .86) 100%); }
.g-left { width: min(310px, 30vw); display: flex; flex-direction: column; min-height: 0; }
.g-title { font-family: var(--f-display); font-weight: 800; font-size: clamp(38px, 5vw, 66px); letter-spacing: .1em; line-height: .95; margin: 0; }
.g-sub { font-family: var(--f-mono); font-size: 12px; letter-spacing: .2em; color: var(--amber); margin: 6px 0 16px; }
.g-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-height: 0; padding-right: 2px; scrollbar-width: thin; }
.g-item { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; padding: 7px 10px; border: 1px solid var(--line); background: rgba(13, 17, 15, .55); }
.g-item:hover { border-color: var(--line-strong); } .g-item.sel { border-color: var(--amber); background: rgba(52, 38, 10, .7); }
.g-item b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: .04em; line-height: 1.1; } .g-item span { font-size: 13px; color: var(--dim); }
.flag { width: 34px; height: 23px; border: 1px solid rgba(0, 0, 0, .5); position: relative; overflow: hidden; display: block; }
.flag.cn { background: #de2910; } .flag.cn::before { content: '★'; position: absolute; left: 3px; top: -1px; color: #ffde00; font-size: 12px; line-height: 1.2; text-shadow: none; }
.flag.ru { background: linear-gradient(#fff 0 33.3%, #0039a6 33.3% 66.6%, #d52b1e 66.6%); } .flag.de { background: linear-gradient(#111 0 33.3%, #dd0000 33.3% 66.6%, #ffce00 66.6%); }
.flag.fr { background: linear-gradient(90deg, #0055a4 0 33.3%, #fff 33.3% 66.6%, #ef4135 66.6%); }
.flag.us { background: repeating-linear-gradient(#b22234 0 1.8px, #fff 1.8px 3.6px); } .flag.us::before { content: ''; position: absolute; left: 0; top: 0; width: 15px; height: 12px; background: #3c3b6e; }
.flag.gb { background: linear-gradient(90deg, transparent 43%, #c8102e 43% 57%, transparent 57%), linear-gradient(transparent 38%, #c8102e 38% 62%, transparent 62%), linear-gradient(90deg, transparent 38%, #fff 38% 62%, transparent 62%), linear-gradient(transparent 30%, #fff 30% 70%, transparent 70%), linear-gradient(33deg, transparent 44%, #fff 44% 56%, transparent 56%), linear-gradient(-33deg, transparent 44%, #fff 44% 56%, transparent 56%), #012169; }
.g-right { width: min(340px, 32vw); display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
.g-card { padding: 12px 14px; }
.g-card h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 30px; letter-spacing: .04em; line-height: 1; } .g-card h3 { margin: 3px 0 8px; font-size: 14px; font-weight: 500; color: var(--amber); letter-spacing: .06em; }
.g-card p { margin: 0 0 10px; font-size: 14px; line-height: 1.55; color: var(--dim); }
.bar3 { display: grid; grid-template-columns: 42px 1fr 28px; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; } .bar3 u { display: block; height: 5px; background: rgba(0, 0, 0, .5); border: 1px solid var(--line); text-decoration: none; } .bar3 u i { display: block; height: 100%; background: var(--amber); transition: width .35s; }
.spec { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 13px; margin-top: 8px; } .spec dt { color: var(--dim); } .spec dd { margin: 0; text-align: right; font-family: var(--f-mono); font-size: 12.5px; }
#gx { display: block; width: 100%; height: 150px; }
.g-mid { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 10px; min-width: 0; }
.seg { display: flex; border: 1px solid var(--line-strong); background: var(--plate); } .seg button { padding: 5px 14px; font-size: 14px; color: var(--dim); } .seg button.sel { background: var(--amber); color: #1a1204; font-weight: 700; }
.opt { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; } .opt label { font-size: 12px; letter-spacing: .14em; color: var(--dim); }
.go { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: .2em; padding: 10px 44px 11px; background: var(--amber); color: #1a1204; clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); transition: background .15s, transform .15s; }
.go:hover { background: var(--amber-hot); transform: translateY(-1px); }
.ghost { padding: 6px 16px; border: 1px solid var(--line-strong); background: var(--plate); font-size: 14px; letter-spacing: .08em; } .ghost:hover { border-color: var(--amber); color: var(--amber-hot); }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.rot { display: none; font-size: 13px; letter-spacing: .1em; color: var(--amber-hot); padding: 3px 10px; border: 1px solid var(--line); background: var(--plate); }

.modal.on { display: flex; }

.card h2 { margin: 0 0 12px; font-family: var(--f-display); font-weight: 800; font-size: 30px; letter-spacing: .12em; }
.card.wide { width: min(760px, 100%); }

.board div div { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 2px 0; border-bottom: 1px solid var(--line); } .board .x { color: var(--faint); text-decoration: line-through; } .board .me { color: var(--amber-hot); }

  .g-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; } .g-item { flex: 0 0 auto; grid-template-columns: 26px auto; padding: 5px 8px; } .g-item span { display: none; } .g-item b { font-size: 16px; } .flag { width: 26px; height: 18px; }
  .g-right { order: 3; max-height: 34%; } .g-card p, #gx { display: none; } .g-card h2 { font-size: 22px; } .g-mid { order: 2; }
  .go { font-size: 21px; padding: 8px 30px 9px; } .stats { grid-template-columns: repeat(2, 1fr); } .board { grid-template-columns: 1fr; }

}
@media (max-height: 520px) { #status { transform: scale(.8); transform-origin: left bottom; } #mapbox { transform: scale(.7); transform-origin: right bottom; } .touch #status { transform-origin: left top; transform: scale(.62); } .touch #mapbox { transform-origin: right top; transform: scale(.5); } }
